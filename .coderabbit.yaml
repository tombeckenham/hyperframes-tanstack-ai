# CodeRabbit AI review configuration. The CodeRabbit GitHub App reads this
# file from each PR's base branch to scope and tune reviews.
#
# Setup:
#   1. Install the CodeRabbit GitHub App: https://github.com/marketplace/coderabbitai
#   2. Add this repo to the app's allowed repositories.
#   3. PRs against `main` (or `develop`) will get automated reviews. No runtime
#      app code is required — CodeRabbit is repo tooling, not an SDK integration.
#
# Reference: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
  path_filters:
    - "!legacy-source/**"
    - "!**/*.lock"
    - "!**/dist/**"
    - "!**/.output/**"
    - "!src/routeTree.gen.ts"
  path_instructions:
    - path: "src/routes/api/**"
      instructions: |
        These are TanStack Start server routes that run on Cloudflare Workers.
        Flag any use of `node:fs`, `node:child_process`, or other Node-only
        APIs that won't work in a Worker runtime. Bindings (R2, DOs) are
        accessed via `import { env } from 'cloudflare:workers'`.
    - path: "container/**"
      instructions: |
        This runs inside the Cloudflare Container (Node 22 + Chromium + ffmpeg).
        Standard Node APIs are fine here.

chat:
  auto_reply: true
